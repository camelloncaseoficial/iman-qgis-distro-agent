; ============================================================================
; IMAN Terra - perfil QGIS ISOLADO (iman-distro). Opcao 1, no-fork.
; Carregado via --profile iman-distro --profiles-path %APPDATA%\InstitutoIMAN\...
; NUNCA sobrescreve o perfil/config do usuario (BL-3).
; Marca: fonte unica em docs/design-system.md e brand.py (BL-4).
; Obs.: o QGIS reescreve este arquivo ao sair; estes sao os defaults do 1o run.
; ============================================================================

[locale]
userLocale=pt_BR
overrideFlag=true

[app]
projections\defaultProjectCrs=EPSG:31984
projections\newProjectCrsBehavior=usePresetCrs
projections\layerDefaultCrs=EPSG:31984

[qgis]
showTips=false
; #041 (D-IMAN-039): a checagem de versao e do QGIS, nao do produto. Desligada
; aqui E no launcher (--noversioncheck); allowVersionCheck=false tira a opcao das
; Opcoes. O item "Verificar a versao do QGIS" sai do menu Ajuda pela customizacao
; (PERFIL-DO-PRODUTO.json, customization_rules).
checkVersion=false
allowVersionCheck=false

[core]
; #041 (D-IMAN-039): feed de noticias de https://feed.qgis.org/ desligado. A chave
; e derivada da URL (QgsNewsFeedParser.keyForFeed = "httpsfeedqgisorg", medido).
httpsfeedqgisorg\disabled=true

[UI]
; Habilita a customizacao do QGIS para apontar o splash NATIVO ao asset IMAN
; (mecanismo no-fork provado no spike #004). O arquivo QGISCUSTOMIZATION3.ini e
; escrito pelo launcher (Sync-Perfil.ps1): o splashpath (absoluto, por-instalacao)
; e as regras declaradas em PERFIL-DO-PRODUTO.json (customization_rules).
Customization\enabled=true
; #041 (D-IMAN-039): o tema de UI do produto entra NO ARRANQUE. O QGIS guarda cada
; icone em cache na primeira leitura e setUITheme depois da janela montada nao
; limpa esse cache: sem esta chave, o tema chega tarde para os icones. O
; iman_startup.py ainda chama setUITheme, como redundancia.
UITheme=IMAN Terra

[PythonPlugins]
iman_brand=true
